server:
  port: 18100

spring:
  config:
    # Docker Compose 与 Spring Boot 共用根目录 .env；文件不存在时仍可正常启动。
    import: optional:file:.env[.properties]
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mall_system}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      client-type: jedis
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:18110}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mall.**.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: mall-system-secret-key-2026-b2c-b2b
  expiration: 86400000

elasticsearch:
  hosts: ${ELASTICSEARCH_HOSTS:localhost:19200}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:18101}
    token: ${AI_SERVICE_TOKEN:change-me-local-only}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:18120}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: mall-product

trade:
  payment:
    # 模拟支付只能由 application-dev.yml 覆盖开启。
    simulation-enabled: false
    callback-enabled: false
    alipay:
      public-key: ${ALIPAY_PUBLIC_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
