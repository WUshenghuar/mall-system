services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mall_system
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports: ["16379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:18110:5672", "127.0.0.1:18111:15672"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:18120:9000", "127.0.0.1:18121:9001"]
    volumes: ["minio-data:/data"]

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]

  ai-service:
    build:
      context: ./mall-ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-local-only}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MODEL_API_BASE: ${AI_MODEL_API_BASE:-}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_EMBEDDING_API_BASE: ${AI_EMBEDDING_API_BASE:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI_EMBEDDING_MIN_SCORE: ${AI_EMBEDDING_MIN_SCORE:-0.7}
      AI_RERANK_API_BASE: ${AI_RERANK_API_BASE:-}
      AI_RERANK_API_KEY: ${AI_RERANK_API_KEY:-}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-}
      AI_SLA_P95_MS: ${AI_SLA_P95_MS:-2000}
      AI_SLA_ERROR_RATE: ${AI_SLA_ERROR_RATE:-0.05}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cbec-ai-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      CBEC_OTEL_LOCAL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CBEC_OTEL_LOCAL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      AI_ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["127.0.0.1:18101:8101"]
    depends_on:
      - elasticsearch
      - otel-collector

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
